name: Run JMeter Test and Publish HTML

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 16 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  jmeter-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Java 11
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"

      - name: Install Apache JMeter
        run: |
          wget https://downloads.apache.org/jmeter/binaries/apache-jmeter-5.6.3.tgz
          tar -xzf apache-jmeter-5.6.3.tgz
          mv apache-jmeter-5.6.3 jmeter

      - name: Create reports folder
        run: mkdir -p reports

      - name: Run JMeter test
        run: |
          jmeter/bin/jmeter -n -t load-test.jmx -l reports/result.jtl

      - name: Generate JMeter HTML report
        run: |
          jmeter/bin/jmeter -g reports/result.jtl -o reports/html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports/html
